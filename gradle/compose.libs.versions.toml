[versions]
# Compose stack used by the spotim-compose wrapper module.
compose-bom = "2025.05.01"
androidx-fragment-ktx = "1.8.9"

[libraries]
# BOM drives the individual artefact versions.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }

androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }

# Fragment interop. Declared here so the compose module owns its own fragment dependency
# rather than reaching into the core module's catalog.
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment-ktx" }

[bundles]
# Compose runtime — what `spotim-compose` needs from the Compose stack at compile time.
compose = [
    "androidx-compose-ui",
    "androidx-compose-foundation",
    "androidx-compose-runtime",
]
